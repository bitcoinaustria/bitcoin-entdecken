name: Create Release

on:
  push:
    tags:
      - 'missverstaendnisse-*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX packages
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive \
          texlive-base \
          texlive-binaries \
          texlive-extra-utils \
          texlive-fonts-recommended \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-latex-recommended \
          make
    
    - name: Build PDF
      working-directory: slides/2025-missverstaendnisse
      run: make build
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: slides/2025-missverstaendnisse/2025-missverstaendnisse.pdf
        name: Bitcoin Missverständnisse ${{ github.ref_name }}
        body: |
          PDF-Präsentation: Die 11 häufigsten Bitcoin-Missverständnisse
          
          Automatisch generiert aus dem LaTeX-Quellcode.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}