name: Create Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'missverstaendnisse-*'
      - 'ersteschritte-*'
      - 'mythen-*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX packages and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive \
          texlive-base \
          texlive-binaries \
          texlive-extra-utils \
          texlive-fonts-recommended \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-latex-recommended \
          latexmk \
          make \
          inkscape \
          texlive-font-utils \
          xvfb
    
    - name: Determine presentation type
      id: presentation
      env:
        TAG_NAME: ${{ github.ref_name }}
      run: |
        if [[ "$TAG_NAME" == ersteschritte-* ]]; then
          echo "name=erste-schritte" >> $GITHUB_OUTPUT
          echo "title=Bitcoin Erste Schritte" >> $GITHUB_OUTPUT
          echo "description=PDF-Präsentation: Bitcoin Erste Schritte" >> $GITHUB_OUTPUT
        elif [[ "$TAG_NAME" == missverstaendnisse-* ]]; then
          echo "name=missverstaendnisse" >> $GITHUB_OUTPUT
          echo "title=Bitcoin Missverständnisse" >> $GITHUB_OUTPUT
          echo "description=PDF-Präsentation: Die häufigsten Bitcoin-Missverständnisse" >> $GITHUB_OUTPUT
        elif [[ "$TAG_NAME" == mythen-* ]]; then
          echo "name=mythen" >> $GITHUB_OUTPUT
          echo "title=Bitcoin Ursprungs-Mythen" >> $GITHUB_OUTPUT
          echo "description=PDF-Präsentation: Bitcoin Ursprungs-Mythen und was wirklich dahinter steckt" >> $GITHUB_OUTPUT
        fi
    
    - name: Build PDF
      working-directory: slides/
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        make build PRESENTATION=${{ steps.presentation.outputs.name }}
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: slides/${{ steps.presentation.outputs.name }}/${{ steps.presentation.outputs.name }}.pdf
        name: ${{ steps.presentation.outputs.title }} ${{ github.ref_name }}
        body: |
          ${{ steps.presentation.outputs.description }}
          
          Automatisch generiert aus dem LaTeX-Quellcode.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
