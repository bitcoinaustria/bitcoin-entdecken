name: Create Release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags:
      - 'missverstaendnisse-*'

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install LaTeX packages and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive \
          texlive-base \
          texlive-binaries \
          texlive-extra-utils \
          texlive-fonts-recommended \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-latex-recommended \
          latexmk \
          make \
          inkscape \
          texlive-font-utils \
          xvfb
    
    - name: Build PDF
      working-directory: slides/2025-missverstaendnisse
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        make build
        
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: slides/2025-missverstaendnisse/2025-missverstaendnisse.pdf
        name: Bitcoin Missverständnisse ${{ github.ref_name }}
        body: |
          PDF-Präsentation: Die häufigsten Bitcoin-Missverständnisse
          
          Automatisch generiert aus dem LaTeX-Quellcode.
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
