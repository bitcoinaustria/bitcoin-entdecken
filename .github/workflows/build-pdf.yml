name: Build PDF

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      presentation:
        description: 'Presentation to build (directory name under slides/)'
        required: false
        default: 'mythen'
  push:
    branches:
      - main
    paths:
      - 'slides/missverstaendnisse/**/*.tex'
      - 'slides/missverstaendnisse/makefile'
      - 'slides/missverstaendnisse/**/*.svg'
      - 'slides/missverstaendnisse/pix/**'
      - 'slides/erste-schritte/**/*.tex'
      - 'slides/erste-schritte/makefile'
      - 'slides/erste-schritte/**/*.svg'
      - 'slides/erste-schritte/pix/**'
      - 'slides/mythen/**/*.tex'
      - 'slides/mythen/**/*.svg'
      - 'slides/mythen/pix/**'
  pull_request:
    branches:
      - main
    paths:
      - 'slides/missverstaendnisse/**/*.tex'
      - 'slides/missverstaendnisse/makefile'
      - 'slides/missverstaendnisse/**/*.svg'
      - 'slides/missverstaendnisse/pix/**'
      - 'slides/erste-schritte/**/*.tex'
      - 'slides/erste-schritte/makefile'
      - 'slides/erste-schritte/**/*.svg'
      - 'slides/erste-schritte/pix/**'
      - 'slides/mythen/**/*.tex'
      - 'slides/mythen/**/*.svg'
      - 'slides/mythen/pix/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install LaTeX packages and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          texlive \
          texlive-base \
          texlive-binaries \
          texlive-extra-utils \
          texlive-fonts-recommended \
          texlive-latex-base \
          texlive-latex-extra \
          texlive-latex-recommended \
          latexmk \
          make \
          inkscape \
          texlive-font-utils \
          xvfb
    
    - name: Determine changed presentation
      id: pres
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "name=${{ inputs.presentation }}" >> $GITHUB_OUTPUT
          exit 0
        fi
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
        else
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
        fi
        if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || echo "")
        else
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
        fi
        if echo "$CHANGED" | grep -q 'slides/mythen/'; then
          echo "name=mythen" >> $GITHUB_OUTPUT
        else
          echo "name=missverstaendnisse" >> $GITHUB_OUTPUT
        fi

    - name: Build PDF
      working-directory: slides/
      env:
        PRES: ${{ steps.pres.outputs.name }}
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
        make build PRESENTATION="$PRES"

    - name: Upload PDF artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.pres.outputs.name }}-pdf
        path: slides/${{ steps.pres.outputs.name }}/${{ steps.pres.outputs.name }}.pdf
        retention-days: 30